version: "3"
services:
  nginx:
    image: nginx:1.17
    container_name: nginx
    ports:
      - "8170:80"
    volumes:
      - "./nginx_config:/etc/nginx/conf.d/"
    depends_on:
      - server
      - client
  server:
    build: ./docker/golang
    container_name: server
    working_dir: "/.go/src/github.com/Wisteria30/J-analyzer/"
    command: /.go/bin/air
    ports:
      - "8180:3000"
    volumes:
      - ./server:/.go/src/github.com/Wisteria30/J-analyzer/
    tty: true
    depends_on:
      - db
      - recognition
      - analyzer
  client:
    build: ./docker/client
    command: yarn dev
    container_name: client
    working_dir: "/app"
    ports:
      - "8190:3000"
    volumes:
      - "./client:/app"
    tty: true
  recognition:
    build: ./docker/python
    container_name: recognition
    working_dir: "/app"
    command: gunicorn main:app
    volumes:
      - ./recognition:/app
    ports:
      - "8200:8000"
    environment:
      - PORT=8000
    tty: true
  analyzer:
    build: ./docker/c++
    container_name: analyzer
    working_dir: "/build"
    command: ./src/server/server
    volumes:
      - ./analyzer:/app
    ports:
      - 8210:8888
    tty: true
  db:
    image: mysql:8.0
    container_name: app-db
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: j-analyzer
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_USER: default
      MYSQL_PASSWORD: password
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
